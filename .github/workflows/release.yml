name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          ref_type = os.environ["GITHUB_REF_TYPE"]
          tag = os.environ["GITHUB_REF_NAME"]

          if ref_type != "tag":
              raise SystemExit(f"release workflow must run on a tag, got {ref_type!r}")
          if not re.fullmatch(r"v[0-9]+[.][0-9]+[.][0-9]+", tag):
              raise SystemExit(
                  f"release tag {tag!r} must use vMAJOR.MINOR.PATCH format"
              )

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(
                  f"release tag {tag!r} does not match pyproject version {expected!r}"
              )

          # A release candidate must retain the preceding public release history.
          current_version = tuple(int(part) for part in version.split("."))
          previous_releases = []
          for previous_tag in subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines():
              if re.fullmatch(r"v[0-9]+[.][0-9]+[.][0-9]+", previous_tag):
                  previous_version = tuple(int(part) for part in previous_tag[1:].split("."))
                  if previous_version < current_version:
                      previous_releases.append((previous_version, previous_tag))
          if previous_releases:
              previous_tag = max(previous_releases)[1]
              if subprocess.run(
                  ["git", "merge-base", "--is-ancestor", previous_tag, "HEAD"]
              ).returncode != 0:
                  raise SystemExit(f"release {tag} is missing baseline {previous_tag}")
              print(f"Release baseline verified: {previous_tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"version={version}", file=out)
              print(f"tag={tag}", file=out)

          print(f"Preparing culsma {version}")
          PY

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs:
      - validate
      - test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Run CLI smoke check
        run: |
          cat > /tmp/culsma-smoke.culs <<'CULSMA'
          protocol CliSmoke {
            let sample = tube(label = "AcquisitionSample", capacity = 2000uL, load = [content(kind = "biosample", code = "S1", type = "cell_sample"):1000uL]);
            return sample;
          }
          CULSMA
          culsma /tmp/culsma-smoke.culs

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: culsma-dist-${{ needs.validate.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    environment:
      name: pypi
      url: https://pypi.org/p/culsma
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: culsma-dist-${{ needs.validate.outputs.tag }}
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
